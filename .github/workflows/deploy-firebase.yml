name: Deploy Firebase
# Actions → "Deploy Firebase" → Run workflow.
# Tests the Firestore security rules on the official emulator FIRST; deploys only if they pass.
# Publishes: Firestore rules + indexes (incl. TTL), and the admin portal + privacy/deletion pages
# to https://gen-z-code-55caf.web.app (admin portal: /admin/) and Cloud Functions.
# Functions require Blaze. Only the full functions targets include Play purchase
# verification, which requires PLAY_SERVICE_ACCOUNT_JSON (see functions/README.md).
# Needs repository secret FIREBASE_SERVICE_ACCOUNT (see docs/ADMIN_PORTAL.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options: [everything, rules-and-indexes, admin-portal, functions, daily-code, community]
        default: community
      enable_admin_mfa:
        description: 'Enable authenticator-app (TOTP) two-step verification (only after the paid Identity Platform upgrade; optional)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_ID: gen-z-code-55caf
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate project source
        shell: bash
        run: |
          DIR="$GITHUB_WORKSPACE"
          if ! { [ -f "$DIR/package-lock.json" ] && [ -f "$DIR/firebase.json" ] && [ -f "$DIR/firebase/firestore.rules" ]; }; then
            mapfile -d '' archives < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print0)
            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Commit the extracted project at the repository root, or keep exactly one project ZIP there."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/genz-source"
            unzip -q "${archives[0]}" -d "$RUNNER_TEMP/genz-source"
            DIR=
            while IFS= read -r -d '' candidate; do
              DIR="$(dirname "$candidate")"
              if [ -f "$DIR/package-lock.json" ] && [ -f "$DIR/firebase.json" ] && [ -f "$DIR/firebase/firestore.rules" ]; then break; fi
              DIR=
            done < <(find "$RUNNER_TEMP/genz-source" -maxdepth 3 -type f -name firebase.json -print0)
            if [ -z "$DIR" ]; then
              echo "::error::Project source was not found in the archive."
              exit 1
            fi
          fi
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify admin source completeness
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/check-admin-source.mjs
      - name: Install
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Test security rules (deploy is blocked if any test fails)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-genz-code "node --test firebase/rules-tests/rules.test.mjs"
      - name: Build admin portal and public pages
        if: ${{ inputs.target != 'rules-and-indexes' && inputs.target != 'functions' }}
        working-directory: ${{ env.PROJECT_DIR }}/admin
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Build Cloud Functions
        if: ${{ inputs.target == 'everything' || inputs.target == 'functions' || inputs.target == 'daily-code' || inputs.target == 'community' }}
        working-directory: ${{ env.PROJECT_DIR }}/functions
        run: npm ci --no-audit --no-fund && npm run build && npm run typecheck
      - name: Test community payments and scheduling
        if: ${{ inputs.target == 'everything' || inputs.target == 'functions' || inputs.target == 'daily-code' || inputs.target == 'community' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-genz-feature-core "node --test functions/tests/community-features.test.cjs"
      - name: Load deploy credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret first (docs/ADMIN_PORTAL.md)."; exit 1; }
          umask 077 && printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('type')=='service_account', 'Not a service-account key'; assert d.get('project_id')==sys.argv[2], 'Key belongs to another project'" "$RUNNER_TEMP/sa.json" "$PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          case "$TARGET" in
            rules-and-indexes) ONLY="firestore:rules,firestore:indexes" ;;
            admin-portal) ONLY="hosting" ;;
            functions) ONLY="functions" ;;
            daily-code) ONLY="firestore:rules,firestore:indexes,functions:communityFeature,functions:publishDailyCodes,hosting" ;;
            community) ONLY="firestore:rules,firestore:indexes,functions:communityFeature,functions:publishDailyCodes,functions:cleanupContributions,functions:admobReward,hosting" ;;
            *) ONLY="firestore:rules,firestore:indexes,hosting,functions" ;;
          esac
          npx --yes firebase-tools@15 deploy --only "$ONLY" --project "$PROJECT_ID" --non-interactive
          echo "### Deployed: $ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin portal: https://$PROJECT_ID.web.app/admin/ · Account deletion page: https://$PROJECT_ID.web.app/delete-account.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify community callable is reachable
        if: ${{ inputs.target == 'community' || inputs.target == 'daily-code' || inputs.target == 'everything' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/check-community-service.mjs
      - name: Explain hosting-only deployment
        if: ${{ inputs.target == 'admin-portal' }}
        run: |
          echo "::warning::Only web/admin pages were deployed. To activate Daily Code, account tokens, Chat Pass and Posts, run this workflow with target community (requires Blaze)."
          echo "Backend activation: not included in admin-portal target. Run target community to activate paid features." >> "$GITHUB_STEP_SUMMARY"
      - name: Enable TOTP two-step verification for the project
        if: ${{ inputs.enable_admin_mfa }}
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          CODE=$(curl -sS -o mfa.json -w '%{http_code}' -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config?updateMask=mfa" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "Content-Type: application/json" -H "X-Goog-User-Project: $PROJECT_ID" \
            -d '{"mfa":{"providerConfigs":[{"state":"ENABLED","totpProviderConfig":{"adjacentIntervals":5}}]}}')
          if [ "$CODE" = "200" ]; then echo "TOTP two-step verification is enabled."; echo "TOTP MFA: enabled" >> "$GITHUB_STEP_SUMMARY"
          else head -c 800 mfa.json; echo; echo "::warning::Could not enable TOTP automatically (HTTP $CODE). In the Firebase console upgrade Authentication to Identity Platform, then run this workflow again."; fi
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" mfa.json
