name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options:
          - community
          - daily-code
          - admin-portal
          - rules-and-indexes
          - everything
          - functions
        default: community

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      PROJECT_ID: gen-z-code-55caf
      TARGET: ${{ inputs.target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project source
        run: |
          DIR="$GITHUB_WORKSPACE"

          if ! {
            [ -f "$DIR/package-lock.json" ] &&
            [ -f "$DIR/firebase.json" ] &&
            [ -f "$DIR/firebase/firestore.rules" ]
          }; then
            mapfile -d '' archives < <(
              find "$GITHUB_WORKSPACE" -maxdepth 1 \
                -type f -iname '*.zip' -print0
            )

            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Commit the extracted source at the repository root, or keep exactly one project ZIP there."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/genz-source"
            unzip -q "${archives[0]}" -d "$RUNNER_TEMP/genz-source"

            DIR=""
            while IFS= read -r -d '' candidate; do
              candidate_dir="$(dirname "$candidate")"

              if [ -f "$candidate_dir/package-lock.json" ] &&
                 [ -f "$candidate_dir/firebase/firestore.rules" ]; then
                DIR="$candidate_dir"
                break
              fi
            done < <(
              find "$RUNNER_TEMP/genz-source" -maxdepth 4 \
                -type f -name firebase.json -print0
            )

            if [ -z "$DIR" ]; then
              echo "::error::Project source was not found in the ZIP."
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Check admin source
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/check-admin-source.mjs

      - name: Test Firestore security rules
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx --yes firebase-tools@15 emulators:exec \
            --only firestore \
            --project demo-genz-code \
            "node --test firebase/rules-tests/rules.test.mjs"

      - name: Build admin portal and public pages
        if: ${{ inputs.target != 'rules-and-indexes' && inputs.target != 'functions' }}
        working-directory: ${{ env.PROJECT_DIR }}/admin
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Build Cloud Functions
        if: ${{ inputs.target == 'community' || inputs.target == 'daily-code' || inputs.target == 'everything' || inputs.target == 'functions' }}
        working-directory: ${{ env.PROJECT_DIR }}/functions
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run typecheck

      - name: Test backend payments and scheduling
        if: ${{ inputs.target == 'community' || inputs.target == 'daily-code' || inputs.target == 'everything' || inputs.target == 'functions' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          TESTS=(functions/tests/community-features.test.cjs)

          for file in \
            functions/tests/vps-api.test.cjs \
            functions/tests/cloud-callable.test.cjs
          do
            if [ -f "$file" ]; then
              TESTS+=("$file")
            fi
          done

          npx --yes firebase-tools@15 emulators:exec \
            --only auth,firestore \
            --project demo-genz-feature-core \
            "node --test --test-concurrency=1 ${TESTS[*]}"

      - name: Load Firebase deployment credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT repository secret."
            exit 1
          fi

          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

          python3 - "$RUNNER_TEMP/sa.json" "$PROJECT_ID" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as handle:
              credential = json.load(handle)

          assert credential.get("type") == "service_account", \
              "Expected a service-account credential"
          assert credential.get("project_id") == sys.argv[2], \
              "Credential belongs to another Firebase project"
          PY

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          EXTRA_ARGS=()

          case "$TARGET" in
            community)
              ONLY="firestore:rules,firestore:indexes,functions:communityFeature,functions:publishDailyCodes,functions:cleanupContributions,functions:admobReward,hosting"
              EXTRA_ARGS+=(--force)
              ;;
            daily-code)
              ONLY="firestore:rules,firestore:indexes,functions:communityFeature,functions:publishDailyCodes,hosting"
              EXTRA_ARGS+=(--force)
              ;;
            admin-portal)
              ONLY="hosting"
              ;;
            rules-and-indexes)
              ONLY="firestore:rules,firestore:indexes"
              ;;
            everything)
              ONLY="firestore:rules,firestore:indexes,hosting,functions"
              ;;
            functions)
              ONLY="functions"
              ;;
            *)
              echo "::error::Unknown deployment target: $TARGET"
              exit 1
              ;;
          esac

          npx --yes firebase-tools@15 deploy \
            --only "$ONLY" \
            --project "$PROJECT_ID" \
            --non-interactive \
            "${EXTRA_ARGS[@]}"

          echo "### Firebase deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://$PROJECT_ID.web.app/" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin: https://$PROJECT_ID.web.app/admin/" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify protected Community endpoint
        if: ${{ inputs.target == 'community' || inputs.target == 'daily-code' || inputs.target == 'everything' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: node scripts/check-community-service.mjs

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
