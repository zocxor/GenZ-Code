name: Deploy Firebase
# Actions → "Deploy Firebase" → Run workflow.
# Tests the Firestore security rules on the official emulator FIRST; deploys only if they pass.
# Publishes: Firestore rules + indexes (incl. TTL), and the admin portal + privacy/deletion pages
# to https://gen-z-code-55caf.web.app  (admin portal: /admin/).
# Needs repository secret FIREBASE_SERVICE_ACCOUNT (see docs/ADMIN_PORTAL.md).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options: [everything, rules-and-indexes, admin-portal]
        default: everything
      enable_admin_mfa:
        description: 'Enable authenticator-app (TOTP) two-step verification in Firebase Auth (required for admin sign-in)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_ID: gen-z-code-55caf
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project (from the uploaded zip if present)
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print | sort | tail -1)
          if [ -n "$ZIP" ]; then echo "Using project archive: $ZIP"; mkdir -p "$RUNNER_TEMP/p" && unzip -q "$ZIP" -d "$RUNNER_TEMP/p"; SEARCH="$RUNNER_TEMP/p"; else SEARCH="$GITHUB_WORKSPACE"; fi
          RULES=$(find "$SEARCH" -maxdepth 4 -path '*/firebase/firestore.rules' | head -1)
          [ -n "$RULES" ] || { echo "::error::firebase/firestore.rules not found."; exit 1; }
          echo "PROJECT_DIR=$(cd "$(dirname "$RULES")/.." && pwd)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --no-audit --no-fund
      - name: Test security rules (deploy is blocked if any test fails)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-genz-code "node --test firebase/rules-tests/rules.test.mjs"
      - name: Build admin portal and public pages
        if: ${{ inputs.target != 'rules-and-indexes' }}
        working-directory: ${{ env.PROJECT_DIR }}/admin
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Load deploy credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret first (docs/ADMIN_PORTAL.md)."; exit 1; }
          umask 077 && printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('type')=='service_account', 'Not a service-account key'; assert d.get('project_id')==sys.argv[2], 'Key belongs to another project'" "$RUNNER_TEMP/sa.json" "$PROJECT_ID"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          case "$TARGET" in
            rules-and-indexes) ONLY="firestore:rules,firestore:indexes" ;;
            admin-portal) ONLY="hosting" ;;
            *) ONLY="firestore:rules,firestore:indexes,hosting" ;;
          esac
          npx --yes firebase-tools@15 deploy --only "$ONLY" --project "$PROJECT_ID" --non-interactive
          echo "### Deployed: $ONLY" >> "$GITHUB_STEP_SUMMARY"
          echo "Admin portal: https://$PROJECT_ID.web.app/admin/ · Account deletion page: https://$PROJECT_ID.web.app/delete-account.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable TOTP two-step verification for the project
        if: ${{ inputs.enable_admin_mfa }}
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          CODE=$(curl -sS -o mfa.json -w '%{http_code}' -X PATCH "https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config?updateMask=mfa" \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" -H "Content-Type: application/json" -H "X-Goog-User-Project: $PROJECT_ID" \
            -d '{"mfa":{"providerConfigs":[{"state":"ENABLED","totpProviderConfig":{"adjacentIntervals":5}}]}}')
          if [ "$CODE" = "200" ]; then echo "TOTP two-step verification is enabled."; echo "TOTP MFA: enabled" >> "$GITHUB_STEP_SUMMARY"
          else head -c 800 mfa.json; echo; echo "::warning::Could not enable TOTP automatically (HTTP $CODE). In the Firebase console upgrade Authentication to Identity Platform, then run this workflow again."; fi
      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" mfa.json
