name: Android APK
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU architectures'
        default: 'arm64-v8a,armeabi-v7a'
        required: true
permissions:
  contents: read

jobs:
  internal-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ABIS: ${{ inputs.abis }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: '[[ "$ABIS" =~ ^(arm64-v8a|armeabi-v7a|x86|x86_64)(,(arm64-v8a|armeabi-v7a|x86|x86_64))*$ ]] || { echo "Invalid ABI list"; exit 1; }'
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: npm ci
      - name: Quality gates
        run: npm run typecheck && npm test && node scripts/security-scan.mjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build internal APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleInternal -PreactNativeArchitectures="$ABIS" --no-daemon
      - name: Verify signature, identity and permissions
        run: |
          APK=$(ls android/app/build/outputs/apk/internal/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|uses-permission" | tee apk-report.txt
          grep -q "name='com.genzmode.app' versionCode='8'" apk-report.txt
          if grep -E "permission.(CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES)'" apk-report.txt; then echo "Unexpected dangerous permission in APK"; exit 1; fi
          sha256sum "$APK" | tee -a apk-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: genz-code-0.8.0-internal-apk
          path: |
            android/app/build/outputs/apk/internal/*.apk
            apk-report.txt
          retention-days: 14
