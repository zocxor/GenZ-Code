name: Android APK
# Actions → "Android APK" → Run workflow.
#  apk:      test APK (internal test key) for sideloading — small, phone-only (arm64) by default.
#  play-aab: Google Play bundle for internal/closed testing, signed with YOUR upload key from
#            repository secrets (GENZ_UPLOAD_KEYSTORE_BASE64, GENZ_UPLOAD_STORE_PASSWORD,
#            GENZ_UPLOAD_KEY_ALIAS, GENZ_UPLOAD_KEY_PASSWORD). The production "release" build stays
#            gated by scripts/release-readiness.mjs.
# Works with the project uploaded as a zip in the repository root, or as normal files.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'APK CPU architectures (arm64-v8a = almost all phones since 2017; add ,armeabi-v7a for very old phones)'
        default: 'arm64-v8a'
        required: true
      aab:
        description: 'Also build the Play Store AAB (needs the 4 upload-key secrets)'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ABIS: ${{ inputs.abis }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project (from the uploaded zip if present)
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print | sort | tail -1)
          if [ -n "$ZIP" ]; then echo "Using project archive: $ZIP"; mkdir -p "$RUNNER_TEMP/project" && unzip -q "$ZIP" -d "$RUNNER_TEMP/project"; SEARCH="$RUNNER_TEMP/project"; else SEARCH="$GITHUB_WORKSPACE"; fi
          DIR=$(find "$SEARCH" -maxdepth 3 -name package.json -not -path "*/node_modules/*" -not -path "*/admin/*" -exec dirname {} \; | while read d; do [ -d "$d/android" ] && echo "$d"; done | head -1)
          [ -n "$DIR" ] || { echo "::error::Project not found. Upload the GenZ Code source zip to the repository root."; exit 1; }
          echo "Project folder: $DIR ($(node -p "require('$DIR/package.json').version"))"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Validate inputs
        run: '[[ "$ABIS" =~ ^(arm64-v8a|armeabi-v7a|x86|x86_64)(,(arm64-v8a|armeabi-v7a|x86|x86_64))*$ ]] || { echo "Invalid ABI list"; exit 1; }'
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Quality gates
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run typecheck && npm test && node scripts/security-scan.mjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK (compressed native libraries for a smaller download)
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: chmod +x gradlew && ./gradlew assembleInternal -PreactNativeArchitectures="$ABIS" -Pexpo.useLegacyPackaging=true --no-daemon
      - name: Collect and verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out" && cp android/app/build/outputs/apk/internal/*.apk "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"; APK=$(ls *.apk | head -1); BT="$ANDROID_HOME/build-tools/36.0.0"
          AAPT="$BT/aapt2"; [ -x "$AAPT" ] || AAPT="$BT/aapt"
          { "$BT/apksigner" verify --print-certs "$APK" | sed -n "1,4p"; "$AAPT" dump badging "$APK" | grep -E "^package:|uses-permission"; ls -la "$APK"; sha256sum "$APK"; } | tee apk-report.txt
          grep -q "name='com.genzmode.app'" apk-report.txt
          if grep -E "permission.(CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|USE_BIOMETRIC|USE_FINGERPRINT)'" apk-report.txt; then echo "::error::Unexpected dangerous permission in APK"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: genz-code-apk, path: out/, if-no-files-found: warn, retention-days: 14}

  play-aab:
    if: ${{ inputs.aab }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project (from the uploaded zip if present)
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print | sort | tail -1)
          if [ -n "$ZIP" ]; then mkdir -p "$RUNNER_TEMP/project" && unzip -q "$ZIP" -d "$RUNNER_TEMP/project"; SEARCH="$RUNNER_TEMP/project"; else SEARCH="$GITHUB_WORKSPACE"; fi
          DIR=$(find "$SEARCH" -maxdepth 3 -name package.json -not -path "*/node_modules/*" -not -path "*/admin/*" -exec dirname {} \; | while read d; do [ -d "$d/android" ] && echo "$d"; done | head -1)
          [ -n "$DIR" ] || { echo "::error::Project not found."; exit 1; }
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.GENZ_UPLOAD_KEYSTORE_BASE64 }}
          P1: ${{ secrets.GENZ_UPLOAD_STORE_PASSWORD }}
          P2: ${{ secrets.GENZ_UPLOAD_KEY_ALIAS }}
          P3: ${{ secrets.GENZ_UPLOAD_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 P1 P2 P3; do [ -n "${!v}" ] || { echo "::error::Missing upload-key secret(s). Add GENZ_UPLOAD_KEYSTORE_BASE64, GENZ_UPLOAD_STORE_PASSWORD, GENZ_UPLOAD_KEY_ALIAS, GENZ_UPLOAD_KEY_PASSWORD (docs/BUILD_APK.md)."; exit 1; }; done
          umask 077 && printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.keystore" || { echo "::error::GENZ_UPLOAD_KEYSTORE_BASE64 is not valid base64. Re-copy it with the PowerShell command in docs/BUILD_APK.md."; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$P1" >/dev/null 2>&1; then echo "::error::Cannot open the keystore: GENZ_UPLOAD_STORE_PASSWORD is wrong, or the file is not a .jks/.keystore."; exit 1; fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$P1" -alias "$P2" >/dev/null 2>&1; then
            echo "::error::Key alias '$P2' is not in this keystore. Aliases found:"; keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$P1" 2>/dev/null | grep -i "PrivateKeyEntry" | cut -d, -f1; exit 1
          fi
          echo "Upload keystore OK (alias found)."
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools'}
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed Play bundle (all CPU architectures; Play delivers only what each phone needs)
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          GENZ_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          GENZ_UPLOAD_STORE_PASSWORD: ${{ secrets.GENZ_UPLOAD_STORE_PASSWORD }}
          GENZ_UPLOAD_KEY_ALIAS: ${{ secrets.GENZ_UPLOAD_KEY_ALIAS }}
          GENZ_UPLOAD_KEY_PASSWORD: ${{ secrets.GENZ_UPLOAD_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleBeta -PgenzVersionCode=$((100 + GITHUB_RUN_NUMBER)) --no-daemon
      - name: Collect and verify AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out" && cp android/app/build/outputs/bundle/beta/*.aab "$GITHUB_WORKSPACE/out/"
          cd "$GITHUB_WORKSPACE/out"; AAB=$(ls *.aab | head -1)
          { echo "versionCode: $((100 + GITHUB_RUN_NUMBER))"; keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"; ls -la "$AAB"; sha256sum "$AAB"; } | tee aab-report.txt
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: genz-code-play-aab, path: out/, if-no-files-found: warn, retention-days: 14}
