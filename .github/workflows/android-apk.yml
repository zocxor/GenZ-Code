name: Clean repository
on: workflow_dispatch
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove loose project files (keeps .github and the source zip)
        run: |
          ls GenZ_Code_*_Source*.zip >/dev/null 2>&1 || { echo "::error::Upload GenZ_Code_0.8.1_Source.zip first. Nothing was deleted."; exit 1; }
          git ls-files -z | while IFS= read -r -d '' p; do
            case "$p" in .github/*|GenZ_Code_*_Source*.zip) ;; *) git rm -q -- "$p" ;; esac
          done
          if git diff --cached --quiet; then echo "Already clean."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Removing $(git diff --cached --name-only | wc -l) files:"; git diff --cached --name-only
          git commit -q -m "Remove loose 0.8.0 files; builds use the source zip" && git push
          echo "Kept:"; git ls-files
