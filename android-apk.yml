name: Android APK
# Run from GitHub → Actions → "Android APK" → Run workflow.
# internal-apk: test APK signed with the project's internal test key (same as earlier test builds,
#               so it installs as an update over them). Download it from the run's Artifacts.
# release-aab:  Play upload bundle signed with YOUR upload key from repository secrets. Blocked by
#               scripts/release-readiness.mjs until every gate in production-readiness.json has evidence.
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU architectures (arm64-v8a covers almost all current phones)'
        default: 'arm64-v8a,armeabi-v7a'
        required: true
      release:
        description: 'Also build the signed release AAB (needs signing secrets + readiness evidence)'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  internal-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ABIS: ${{ inputs.abis }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: '[[ "$ABIS" =~ ^(arm64-v8a|armeabi-v7a|x86|x86_64)(,(arm64-v8a|armeabi-v7a|x86|x86_64))*$ ]] || { echo "Invalid ABI list"; exit 1; }'
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: npm ci
      - name: Quality gates
        run: npm run typecheck && npm test && node scripts/security-scan.mjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build internal APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleInternal -PreactNativeArchitectures="$ABIS" --no-daemon
      - name: Verify signature, identity and permissions
        run: |
          APK=$(ls android/app/build/outputs/apk/internal/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | head -4
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|uses-permission" | tee apk-report.txt
          grep -q "name='com.genzmode.app' versionCode='8'" apk-report.txt
          if grep -E "permission.(CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES)'" apk-report.txt; then echo "Unexpected dangerous permission in APK"; exit 1; fi
          sha256sum "$APK" | tee -a apk-report.txt
          ls -la "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: genz-code-0.8.0-internal-apk
          path: |
            android/app/build/outputs/apk/internal/*.apk
            apk-report.txt
          retention-days: 14

  release-aab:
    if: ${{ inputs.release }}
    needs: internal-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.GENZ_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Secret GENZ_UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          umask 077 && echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
      - name: Build signed release bundle
        working-directory: android
        env:
          GENZ_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.keystore
          GENZ_UPLOAD_STORE_PASSWORD: ${{ secrets.GENZ_UPLOAD_STORE_PASSWORD }}
          GENZ_UPLOAD_KEY_ALIAS: ${{ secrets.GENZ_UPLOAD_KEY_ALIAS }}
          GENZ_UPLOAD_KEY_PASSWORD: ${{ secrets.GENZ_UPLOAD_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: genz-code-0.8.0-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
