name: GenZ Code quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/security-scan.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npx expo export --platform android --clear
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm ci
      - run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-genz-code "node --test firebase/rules-tests/"
  admin:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: admin}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
